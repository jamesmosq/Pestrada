<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Ejercicio 1 — Metodo GET</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css"
          rel="stylesheet">
</head>
<body class="bg-light">

<div class="container mt-5">
    <div class="row justify-content-center">
        <div class="col-md-6">

            <div class="card shadow-sm">
                <div class="card-header bg-primary text-white">
                    <h5 class="mb-0">Consulta de Clima</h5>
                </div>
                <div class="card-body">

                    <!--
                        action → a donde se envian los datos
                        method → como viajan (GET = en la URL)
                    -->
                    <form action="recibir.html" method="GET">

                        <div class="mb-3">
                            <label for="ciudad" class="form-label">Ciudad</label>
                            <input type="text"
                                   id="ciudad"
                                   name="ciudad"
                                   class="form-control"
                                   placeholder="Ej: Medellin"
                                   required>
                        </div>

                        <div class="mb-3">
                            <label for="pais" class="form-label">Pais</label>
                            <select id="pais" name="pais" class="form-select">
                                <option value="colombia">Colombia</option>
                                <option value="mexico">Mexico</option>
                                <option value="argentina">Argentina</option>
                            </select>
                        </div>

                        <button type="submit" class="btn btn-primary w-100">
                            Consultar
                        </button>

                    </form>

                </div>
            </div>

        </div>
    </div>
</div>

</body>
</html>
