<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Formulario con Validación PHP</title>
    <style>
        body { font-family: Arial, sans-serif; max-width: 500px; margin: 40px auto; padding: 0 20px; }
        h1   { color: #333; }
        .form-group  { margin-bottom: 18px; }
        label        { display: block; font-weight: bold; margin-bottom: 4px; }
        input, select, textarea {
            width: 100%; padding: 8px; border: 1px solid #ccc;
            border-radius: 4px; box-sizing: border-box; font-size: 14px;
        }
        button {
            background: #4CAF50; color: white; padding: 10px 24px;
            border: none; border-radius: 4px; cursor: pointer; font-size: 15px;
        }
        button:hover { background: #45a049; }
        a { display: inline-block; margin-top: 10px; color: #555; }
    </style>
</head>
<body>
    <h1>Registro de Usuario</h1>
    <p>Completa todos los campos. El formulario se valida en el servidor (PHP).</p>

    <form action="validar.php" method="POST">

        <div class="form-group">
            <label for="nombre">Nombre completo:</label>
            <input type="text" id="nombre" name="nombre"
                   placeholder="Ej: Ana García" minlength="3" maxlength="60">
        </div>

        <div class="form-group">
            <label for="email">Correo electrónico:</label>
            <input type="email" id="email" name="email" placeholder="ejemplo@correo.com">
        </div>

        <div class="form-group">
            <label for="edad">Edad:</label>
            <input type="number" id="edad" name="edad" placeholder="18-99" min="1" max="120">
        </div>

        <div class="form-group">
            <label for="password">Contraseña:</label>
            <input type="password" id="password" name="password" placeholder="Mínimo 6 caracteres">
        </div>

        <div class="form-group">
            <label for="password2">Confirmar contraseña:</label>
            <input type="password" id="password2" name="password2" placeholder="Repite la contraseña">
        </div>

        <div class="form-group">
            <label for="rol">Rol:</label>
            <select id="rol" name="rol">
                <option value="">-- Selecciona un rol --</option>
                <option value="estudiante">Estudiante</option>
                <option value="docente">Docente</option>
                <option value="admin">Administrador</option>
            </select>
        </div>

        <button type="submit">Registrar</button>
    </form>
</body>
</html>
